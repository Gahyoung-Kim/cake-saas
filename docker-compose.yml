services:
  mysql:
    image: mysql:8.0
    container_name: caker-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cakesaas
      MYSQL_USER: caker
      MYSQL_PASSWORD: caker
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-ucaker', '-pcaker']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caker-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://caker:caker@mysql:3306/cakesaas
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app/backend
      - uploads_data:/app/backend/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: caker-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - '5173:5173'
    volumes:
      # node_modules는 컨테이너 내부(Linux) 것을 사용
      # 소스 파일만 마운트해서 핫 리로드 지원
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/postcss.config.js:/app/postcss.config.js

volumes:
  mysql_data:
  uploads_data:
