version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: caker-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cakesaas
      MYSQL_USER: caker
      MYSQL_PASSWORD: caker
    ports:
      - '3307:3306'    # 호스트:컨테이너 — Workbench는 localhost:3307로 접속
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-ucaker', '-pcaker']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caker-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      # 컨테이너 내부 네트워크: mysql 호스트명 + 컨테이너 내부 포트 3306
      DATABASE_URL: mysql+pymysql://caker:caker@mysql:3306/cakesaas
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: caker-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mysql_data:
